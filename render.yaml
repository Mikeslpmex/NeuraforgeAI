services:
  - type: web
    name: neuraforge-api
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OXXO_CLIENT_ID
        sync: false
      - key: OXXO_SECRET_KEY
        sync: false
      - key: WEB_APP_URL
        fromService:
          type: web
